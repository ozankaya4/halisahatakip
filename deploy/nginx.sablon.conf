# Halısaha Takip — nginx site yapılandırması
#
# __ALAN_ADI__ yer tutucusunu kurulum.sh dolduruyor. Elle düzenlemeyin;
# deploy/sunucu.env içindeki ALAN_ADI değerini değiştirip kurulum.sh'ı
# tekrar çalıştırın.
#
# TLS satırlarını certbot ekler (certbot --nginx). Bu dosyada 443 bloğu
# başlangıçta yok; certbot çalıştıktan sonra kendisi oluşturur.

server {
    listen 80;
    listen [::]:80;
    server_name __ALAN_ADI__ www.__ALAN_ADI__;

    # Yüklenen fotoğraf sınırı: uygulama 8 MB'da kesiyor, nginx'e biraz pay.
    client_max_body_size 10M;

    # Sunucu sürümünü sızdırma.
    server_tokens off;

    # --- Statik dosyalar ---------------------------------------------------
    # İsimler karma (hash) içerdiği için uzun süre önbelleğe alınabilir.
    # collectstatic .gz üretiyor; gzip_static hazır dosyayı doğrudan verir.
    location /static/ {
        alias /srv/halisaha/staticfiles/;
        gzip_static on;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # --- Korumalı medya ----------------------------------------------------
    # "internal" çok önemli: bu konuma dışarıdan doğrudan İSTEK YAPILAMAZ.
    # Yalnızca Django'nun döndürdüğü X-Accel-Redirect başlığı buraya
    # yönlendirebilir. Yani her fotoğraf isteği önce Django'nun yetki
    # kontrolünden geçer, dosyayı sonra nginx servis eder; Gunicorn işçisi
    # dosya aktarımıyla meşgul olmaz.
    location /korumali-medya/ {
        internal;
        alias /srv/halisaha/media/;

        add_header X-Content-Type-Options "nosniff" always;

        # ⚠️ Content-Disposition BURAYA EKLENMEZ.
        #
        # Django zaten dosya adıyla birlikte gönderiyor
        # ("inline; filename=..."). Burada bir kez daha eklenince yanıtta iki
        # ayrı Content-Disposition başlığı oluşuyor ve Chrome/Brave böyle bir
        # yanıtı BÜTÜNÜYLE REDDEDİYOR:
        #     net::ERR_RESPONSE_HEADERS_MULTIPLE_CONTENT_DISPOSITION
        #
        # Teşhis edilmesi zor bir hata: nginx erişim günlüğünde istek
        # "200" ve doğru boyutla görünür, hata günlüğüne hiçbir şey düşmez,
        # dosya izinleri de doğrudur. Yalnızca tarayıcıda kırık görsel çıkar,
        # üstelik geliştirici araçlarında yanıt başlıkları bölümü bomboş
        # görünür (yanıt atıldığı için).
    }

    location = /favicon.ico {
        alias /srv/halisaha/staticfiles/favicon.ico;
        access_log off;
        log_not_found off;
    }

    # --- Uygulama ----------------------------------------------------------
    location / {
        proxy_pass http://unix:/run/halisaha/gunicorn.sock;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # DİKKAT: $proxy_add_x_forwarded_for DEĞİL.
        # Ekleme yapan biçim, istemcinin gönderdiği X-Forwarded-For değerini
        # başa koyar. django-axes kilitlemeyi IP'ye göre tuttuğu için
        # saldırgan bu başlığı uydurup kendi kilidini atlatabilir ya da
        # başka birinin adresini kilitletebilirdi. Üzerine yazınca başlıkta
        # her zaman tek ve gerçek adres bulunur.
        # settings.py içindeki AXES_IPWARE_PROXY_COUNT = None bununla eşleşir.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_redirect off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
